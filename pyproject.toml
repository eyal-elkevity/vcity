[project]
name = "vcity"
version = "0.1.0"
description = "Voice agent for the City of Corona, CA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "icalendar>=7.3.0",
    "num2words>=0.5.14",
    "pipecat-ai[deepgram,elevenlabs,websocket]==1.14.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
    "uvicorn>=0.32",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcity"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001", "EM101", "EM102", "TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["vcity", "evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0913", "INP001"]
"evals/**" = ["T201"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Pipecat ships py.typed but leaves **kwargs and event-handler registration unannotated.
executionEnvironments = [
  { root = "src/vcity/voice", extraPaths = ["src"], reportUnknownMemberType = false },
  { root = "evals/audio", extraPaths = ["src", "."], reportUnknownMemberType = false },
  { root = "." },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:'audioop' is deprecated:DeprecationWarning",
  "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
]
markers = ["live: calls a real external API; run with `uv run pytest -m live`"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]
