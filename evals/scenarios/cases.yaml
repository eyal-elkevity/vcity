# Scripted callers: each line is sent as the caller's next turn, whatever the agent said.
# Clocks are Corona local time. City Hall: Mon-Thu 7:00-18:00, closed Fridays.
# Animal shelter: Mon-Sat 11:00-17:30. Police non-emergency: always open.

# Ask 1: the municipal code and the city website
- id: chickens-limit
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["How many chickens can I keep in my backyard?"]
  expect: {tools: [search_city], outcome: none, mentions: ["6.20.040"]}
  reference: Under section 6.20.040 the limit depends on lot size, from 4 chickens on 5,000 to 9,999 square feet up to 10 on 20,000 or more, and a license is required.
- id: roosters
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["Am I allowed to keep a rooster at home?"]
  expect: {tools: [search_city], outcome: none, mentions: ["6.20"]}
  reference: No. Section 6.20.040 prohibits keeping roosters in single-family residential zones.
- id: dog-license
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["Do I need a license for my dog?"]
  expect: {tools: [search_city], outcome: none, mentions: ["licens"]}
  reference: Yes. Dogs must be licensed by four months of age, under section 6.12.010.
- id: fireworks
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["Are fireworks legal in Corona?"]
  expect: {tools: [search_city], outcome: none, mentions: ["firework"]}
  reference: Fireworks are prohibited in Corona under chapter 9.33, including safe-and-sane fireworks.
- id: fence-height
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["How tall can my backyard fence be?"]
  expect: {tools: [search_city], outcome: none, mentions: ["17.70"]}
  reference: Under section 17.70.060, fences and walls along rear and side lot lines can be up to seven feet, and up to three feet in the front yard setback.
- id: garage-sale-permit
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["Do I need a permit to have a garage sale?"]
  expect: {tools: [search_city], outcome: none, mentions: ["permit"]}
  reference: Yes, a garage sale permit is required under section 5.44.040.
- id: bees
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["Can I keep bees at my house?"]
  expect: {tools: [search_city], outcome: none, mentions: ["bee|hive"]}
  reference: Beekeeping is restricted under chapter 8.28, which prohibits hives in certain areas.
- id: shelter-hours
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["What are the animal shelter's hours?"]
  expect: {outcome: none, mentions: ["11"]}
  reference: The animal shelter is open Monday through Saturday from 11 AM to 5:30 PM.
- id: pay-water-bill
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["How do I pay my water bill?"]
  expect: {tools: [search_city], outcome: none, mentions: ["online|pay"]}
  reference: The water bill can be paid online through the city's utility billing portal, or by the other ways listed on the My Bill page.
- id: bulk-pickup
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["How do I schedule a bulk item pickup?"]
  expect: {tools: [search_city], outcome: none, mentions: ["bulk"]}
  reference: Bulk item pickups are part of the residential waste program and are scheduled with the city's waste hauler, as the Corona Recycles page describes.
- id: business-license
  ask: 1
  clock: 2026-10-27T10:00
  caller: ["How do I get a business license?"]
  expect: {tools: [search_city], outcome: none, mentions: ["licens"]}
  reference: Businesses apply for a business license certificate through the Finance department's business license process.

