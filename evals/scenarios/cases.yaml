- id: change-of-mind
  ask: 6
  clock: 2026-10-27T10:00
  caller: ["I want to report a broken water meter at 12 Oak Street.", "Actually no, it's not the meter. It's a fire hydrant leaking at 12 Oak Street.", "Nobody is in danger, it's just leaking onto the street. Yes, please send it.", "Yes."]
  expect: {tools: [route_request], route_mentions: ["hydrant"]}
