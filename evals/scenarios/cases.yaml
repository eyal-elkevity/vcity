- id: ambiguous-tree
  ask: 6
  clock: 2026-10-27T10:00
  caller: ["I have a problem with a tree.", "It's a city tree in the parkway in front of my house at 420 Ramona Avenue. A big branch fell and is blocking the sidewalk. Nobody is hurt.", "Yes, please send it.", "Yes."]
