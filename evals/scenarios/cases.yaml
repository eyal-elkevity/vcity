  expect: {tools: [route_request], outcome: ticket, department: public_works, ticket_reason: closing_soon, mentions: ["Monday"]}
  reference: The office closes in a few minutes, so a ticket is filed and Public Works reopens Monday at 7 AM.
- id: caller-wants-ticket
