- id: veterans-day-permit
  ask: 3
  clock: 2026-11-11T10:00
  caller: ["I need to speak with someone in the building department about a permit."]
  expect: {tools: [route_request], outcome: ticket, department: building_planning, ticket_reason: holiday, mentions: ["Thursday|November 12|tomorrow"]}
