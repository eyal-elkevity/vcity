# Ask 3: tickets
- id: pothole-friday-night
  ask: 3
  clock: 2026-10-30T19:30
  caller: ["There's a big pothole on Main Street at 6th Street.", "Yes, that's right."]
  expect: {tools: [route_request], outcome: ticket, department: public_works, ticket_reason: after_hours, mentions: ["Monday"]}
  reference: Public Works is closed, so a ticket is filed with a six-digit reference, and the office reopens Monday at 7 AM.
- id: graffiti-thanksgiving
  ask: 3
  clock: 2026-11-26T10:00
  caller: ["Someone sprayed graffiti on the wall at Brentwood Park.", "Yes, go ahead."]
  expect: {tools: [route_request], outcome: ticket, department: maintenance_services, ticket_reason: holiday, mentions: ["Monday|November 30"]}
  reference: It's Thanksgiving, so a ticket is filed for Maintenance Services and the office reopens Monday, November 30 at 7 AM.
- id: streetlight-closing-soon
  ask: 3
  clock: 2026-10-29T17:55
