  reference: A ticket is filed with Code Compliance for illegal dumping behind 500 Main Street, with a reference number.
- id: barking-dog-sunday
  ask: 3
  clock: 2026-11-01T13:00
  caller: ["My neighbor's dog at 210 Elm Street has been barking all day. Can someone from animal services deal with it?", "Yes, please pass it on.", "Yes."]
  expect: {tools: [route_request], outcome: ticket, department: animal_services, ticket_reason: after_hours, mentions: ["Monday"]}
